<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SonicAI</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f14; color: #eee;
         max-width: 560px; margin: 40px auto; padding: 0 16px 60px; }
  h1 { margin-bottom: 4px; }
  .sub { color: #999; margin-bottom: 24px; }
  .card { background: #1b1b25; border-radius: 14px; padding: 18px; margin-top: 16px; }
  button { background: #7c5cff; color: #fff; border: 0; padding: 10px 18px;
           border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 12px; }
  button:disabled { opacity: .5; }
  button.small { padding: 6px 12px; font-size: 13px; margin-top: 0; background: #2b2b3a; }
  select, input[type=text] { background: #2b2b3a; color: #eee; border: 0; padding: 10px;
           border-radius: 8px; font-size: 14px; }
  input[type=text] { width: 100%; box-sizing: border-box; margin-top: 10px; }
  audio { width: 100%; margin-top: 12px; }
  .now { font-weight: 600; word-break: break-word; }
  .track { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
           word-break: break-word; }
  .track:hover { background: #2b2b3a; }
  .track.active { background: #7c5cff33; color: #fff; }
  .mood { font-size: 28px; font-weight: 700; text-transform: capitalize; }
  .bar { background: #2b2b3a; border-radius: 6px; height: 10px; margin: 4px 0 10px; }
  .fill { background: #7c5cff; height: 10px; border-radius: 6px; }
  .row { display: flex; justify-content: space-between; font-size: 14px; }
  .song { font-size: 14px; padding: 6px 0; border-bottom: 1px solid #2b2b3a; word-break: break-word; }
  .eqrow { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
  .eqrow label { width: 52px; color: #aaa; }
  .eqrow input { flex: 1; accent-color: #7c5cff; }
  .eqrow span { width: 40px; text-align: right; color: #aaa; }
  .eqhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #eqnote { color: #9fe3a6; font-size: 13px; margin-top: 8px; }
  #pinfo { color: #9fe3a6; font-size: 13px; margin-top: 10px; }
  #pstatus { color: #ffb86b; font-size: 13px; margin-top: 8px; }
  .muted { color: #999; font-size: 13px; }
  .dnavals { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; margin-top: 8px; }
  .big { font-size: 26px; font-weight: 700; }
</style>
</head>
<body>
<h1>🎧 SonicAI</h1>
<div class="sub">Play your music, shape the sound, and let the AI understand it.</div>

<div class="card">
  <b>Smart playlist</b>
  <div class="muted" style="margin-top:4px">
    Try: "45 minute energetic workout" or "calm songs for studying"
  </div>
  <input type="text" id="pq" placeholder="Describe the playlist you want">
  <button id="mk">Create playlist</button>
  <div id="pinfo"></div>
  <div id="pstatus"></div>
</div>

<div class="card">
  <input type="file" id="files" accept=".mp3,.wav,.flac" multiple>
  <div class="now" id="now" style="margin-top:12px">No song selected</div>
  <audio id="player" controls crossorigin="anonymous"></audio>
  <br><button id="go">Analyze this song</button>
  <div id="status"></div>
</div>

<div class="card">
  <b>Sound DNA</b>
  <div id="dna" style="margin-top:8px"><div class="muted">Play a song to see its Sound DNA.</div></div>
</div>

<div class="card">
  <div class="eqhead">
    <b>Equalizer</b>
    <span>
      <select id="preset"></select>
      <button class="small" id="reset">Reset</button>
    </span>
  </div>
  <div id="eq" style="margin-top:10px"></div>
  <div id="eqnote"></div>
</div>

<div class="card" id="queueCard" style="display:none">
  <b>Queue</b>
  <div id="queue" style="margin-top:8px"></div>
</div>

<div id="result"></div>

<div class="card">
  <div class="eqhead">
    <b>Listening analytics</b>
    <button class="small" id="refresh">Refresh</button>
  </div>
  <div id="stats" style="margin-top:10px"><div class="muted">Loading...</div></div>
</div>

<script>
const BASE = "http://127.0.0.1:8000";
const API = BASE + "/analyze";
const player = document.getElementById("player");
const now = document.getElementById("now");
const queueEl = document.getElementById("queue");
const queueCard = document.getElementById("queueCard");
const go = document.getElementById("go");
const status = document.getElementById("status");
const result = document.getElementById("result");
const eqEl = document.getElementById("eq");
const presetEl = document.getElementById("preset");
const eqNote = document.getElementById("eqnote");
const dnaBox = document.getElementById("dna");
const statsBox = document.getElementById("stats");

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// each track is { name, file } (chosen from your computer) or { name, url } (from the library)
let tracks = [];
let current = -1;

// ---------- Equalizer ----------
const BANDS = [
  { f: 60,    t: "lowshelf",  label: "60 Hz" },
  { f: 170,   t: "peaking",   label: "170 Hz" },
  { f: 500,   t: "peaking",   label: "500 Hz" },
  { f: 1500,  t: "peaking",   label: "1.5 kHz" },
  { f: 4000,  t: "peaking",   label: "4 kHz" },
  { f: 10000, t: "highshelf", label: "10 kHz" },
];

const PRESETS = {
  "Flat":       [0, 0, 0, 0, 0, 0],
  "Bass Boost": [8, 6, 2, 0, 0, 0],
  "Vocal":      [-2, -1, 2, 4, 3, 0],
  "Rock":       [5, 3, -1, -1, 3, 5],
  "Classical":  [3, 2, 0, 0, 2, 3],
  "Dance":      [6, 4, 0, 2, 3, 2],
  "Chill":      [2, 2, 0, -1, -2, -3],
  "Gaming":     [3, 0, -1, 2, 4, 3],
  "Podcast":    [-4, -1, 3, 4, 2, -2],
};

// AI EQ: mood -> preset
const MOOD_PRESET = { energetic: "Dance", intense: "Rock", calm: "Chill", sad: "Vocal" };

let ctx = null;
const filters = [];
const sliders = [];
const valueLabels = [];

Object.keys(PRESETS).concat("Custom").forEach(name => {
  const o = document.createElement("option");
  o.value = name; o.textContent = name;
  presetEl.appendChild(o);
});

BANDS.forEach((b, i) => {
  const row = document.createElement("div");
  row.className = "eqrow";
  row.innerHTML = `<label>${b.label}</label>
    <input type="range" min="-12" max="12" step="1" value="0">
    <span>0 dB</span>`;
  const slider = row.querySelector("input");
  const val = row.querySelector("span");
  slider.oninput = () => {
    val.textContent = slider.value + " dB";
    if (filters[i]) filters[i].gain.value = +slider.value;
    presetEl.value = "Custom";
    eqNote.textContent = "";
  };
  sliders.push(slider);
  valueLabels.push(val);
  eqEl.appendChild(row);
});

function applyPreset(name) {
  const gains = PRESETS[name];
  if (!gains) return;
  gains.forEach((g, i) => {
    sliders[i].value = g;
    valueLabels[i].textContent = g + " dB";
    if (filters[i]) filters[i].gain.value = g;
  });
  presetEl.value = name;
}

presetEl.onchange = () => { applyPreset(presetEl.value); eqNote.textContent = ""; };
document.getElementById("reset").onclick = () => { applyPreset("Flat"); eqNote.textContent = ""; };

function setupAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  let node = ctx.createMediaElementSource(player);
  BANDS.forEach((b, i) => {
    const fl = ctx.createBiquadFilter();
    fl.type = b.t;
    fl.frequency.value = b.f;
    if (b.t === "peaking") fl.Q.value = 1;
    fl.gain.value = +sliders[i].value;
    node.connect(fl);
    node = fl;
    filters.push(fl);
  });
  node.connect(ctx.destination);
}

// ---------- Listening log ----------
let listened = 0;
let lastT = 0;
let loggedName = null;

player.ontimeupdate = () => {
  const d = player.currentTime - lastT;
  if (d > 0 && d < 1.5) listened += d;
  lastT = player.currentTime;
};

function flushLog() {
  if (loggedName && listened >= 5) {
    fetch(BASE + "/log", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ song: loggedName, seconds: listened }),
      keepalive: true,
    }).catch(() => {});
  }
  listened = 0;
}
player.onpause = flushLog;
window.addEventListener("pagehide", flushLog);

// ---------- Player ----------
document.getElementById("files").onchange = (e) => {
  tracks = Array.from(e.target.files).map(f => ({ name: f.name, file: f }));
  if (!tracks.length) return;
  startQueue();
};

function startQueue() {
  queueCard.style.display = "block";
  result.innerHTML = "";
  status.textContent = "";
  renderQueue();
  play(0);
}

function renderQueue() {
  queueEl.innerHTML = "";
  tracks.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "track" + (i === current ? " active" : "");
    d.textContent = (i + 1) + ". " + t.name;
    d.onclick = () => play(i);
    queueEl.appendChild(d);
  });
}

function play(i) {
  flushLog();
  setupAudio();
  if (ctx.state === "suspended") ctx.resume();
  if (player.src && player.src.startsWith("blob:")) URL.revokeObjectURL(player.src);
  current = i;
  const t = tracks[i];
  loggedName = t.name;
  listened = 0;
  lastT = 0;
  player.src = t.file ? URL.createObjectURL(t.file) : t.url;
  player.play();
  now.textContent = "Now playing: " + t.name;
  result.innerHTML = "";
  status.textContent = "";
  eqNote.textContent = "";
  renderQueue();
  loadDNA(t.name);
}

player.onended = () => {
  flushLog();
  loadStats();
  if (current + 1 < tracks.length) play(current + 1);
};

// ---------- Sound DNA ----------
const DNA_LABELS = {
  energy: "Energy", brightness: "Brightness", bass: "Bass",
  vocal: "Vocals", rhythm: "Rhythm", tempo: "Tempo",
};

function radarSVG(scores) {
  const keys = Object.keys(DNA_LABELS);
  const cx = 130, cy = 120, R = 80;
  const pt = (i, v) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / keys.length;
    return [cx + R * v / 100 * Math.cos(a), cy + R * v / 100 * Math.sin(a)];
  };
  let grid = "";
  [25, 50, 75, 100].forEach(l => {
    grid += `<polygon points="${keys.map((_, i) => pt(i, l).join(",")).join(" ")}" fill="none" stroke="#2b2b3a"/>`;
  });
  const axes = keys.map((_, i) => {
    const [x, y] = pt(i, 100);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2b2b3a"/>`;
  }).join("");
  const poly = keys.map((k, i) => pt(i, scores[k]).join(",")).join(" ");
  const labels = keys.map((k, i) => {
    const [x, y] = pt(i, 122);
    return `<text x="${x}" y="${y}" fill="#aaa" font-size="11" text-anchor="middle" dominant-baseline="middle">${DNA_LABELS[k]}</text>`;
  }).join("");
  return `<svg viewBox="0 0 260 240" width="100%" style="max-width:300px;display:block;margin:0 auto">
    ${grid}${axes}<polygon points="${poly}" fill="#7c5cff55" stroke="#7c5cff" stroke-width="2"/>${labels}</svg>`;
}

function renderDNA(scores, bpm) {
  const vals = Object.keys(DNA_LABELS)
    .map(k => `<div class="row"><span>${DNA_LABELS[k]}</span><span>${scores[k]}</span></div>`).join("");
  dnaBox.innerHTML = radarSVG(scores) +
    `<div class="dnavals">${vals}</div>
     <div class="muted" style="margin-top:8px">${bpm} BPM · scores are relative to your library (0-100)</div>`;
}

async function loadDNA(name) {
  dnaBox.innerHTML = '<div class="muted">Loading Sound DNA...</div>';
  try {
    const res = await fetch(BASE + "/dna?song=" + encodeURIComponent(name));
    if (!res.ok) throw new Error("not in library");
    const d = await res.json();
    if (tracks[current] && tracks[current].name === name) renderDNA(d.scores, d.bpm);
  } catch (e) {
    dnaBox.innerHTML = '<div class="muted">Press "Analyze this song" to compute its Sound DNA.</div>';
  }
}

// ---------- Smart playlist ----------
const pq = document.getElementById("pq");
const mk = document.getElementById("mk");
const pinfo = document.getElementById("pinfo");
const pstatus = document.getElementById("pstatus");

async function makePlaylist() {
  const q = pq.value.trim();
  if (!q) { pstatus.textContent = "Type what kind of playlist you want."; return; }
  mk.disabled = true;
  pstatus.textContent = "Creating playlist...";
  pinfo.textContent = "";
  try {
    const res = await fetch(BASE + "/playlist?q=" + encodeURIComponent(q));
    if (!res.ok) throw new Error("Server error " + res.status);
    const d = await res.json();
    pstatus.textContent = d.note || "";
    if (!d.songs.length) { mk.disabled = false; return; }
    pinfo.textContent = "Detected: " + d.detected_moods.join(", ") +
      " · " + d.total_minutes + " min · " + d.songs.length + " songs";
    tracks = d.songs.map(s => ({ name: s.song, url: BASE + s.url }));
    startQueue();
  } catch (e) {
    pstatus.textContent = "Error: " + e.message + " (is the server running?)";
  }
  mk.disabled = false;
}
mk.onclick = makePlaylist;
pq.onkeydown = (e) => { if (e.key === "Enter") makePlaylist(); };

// ---------- Analyze ----------
go.onclick = async () => {
  if (current < 0) { status.textContent = "Choose songs or create a playlist first."; return; }
  go.disabled = true;
  status.textContent = "Analyzing... (20-40 seconds)";
  result.innerHTML = "";
  try {
    const t = tracks[current];
    const blob = t.file || await (await fetch(t.url)).blob();
    const fd = new FormData();
    fd.append("file", blob, t.name);
    const res = await fetch(API, { method: "POST", body: fd });
    if (!res.ok) throw new Error("Server error " + res.status);
    show(await res.json());
    status.textContent = "";
  } catch (e) {
    status.textContent = "Error: " + e.message + " (is the server running?)";
  }
  go.disabled = false;
};

function show(d) {
  const bars = Object.entries(d.mood_probabilities)
    .sort((a, b) => b[1] - a[1])
    .map(([m, p]) => `<div class="row"><span>${m}</span><span>${Math.round(p*100)}%</span></div>
      <div class="bar"><div class="fill" style="width:${p*100}%"></div></div>`).join("");
  const sims = d.similar_songs
    .map(s => `<div class="song">${esc(s.song)}<br><small>similarity ${s.similarity}</small></div>`).join("");
  result.innerHTML = `
    <div class="card"><div class="mood">${d.mood}</div>
      <div class="muted">${d.tempo_bpm} BPM</div></div>
    <div class="card"><b>Mood breakdown</b><div style="margin-top:10px">${bars}</div></div>
    <div class="card"><b>Similar songs in your library</b>${sims}</div>`;

  if (d.dna) renderDNA(d.dna.scores, d.dna.bpm);

  // AI EQ: pick a preset from the detected mood
  const preset = MOOD_PRESET[d.mood];
  if (preset) {
    applyPreset(preset);
    eqNote.textContent = "AI EQ applied: " + preset + " (detected mood: " + d.mood + ")";
  }
}

// ---------- Listening analytics ----------
function fmtMin(m) {
  const h = Math.floor(m / 60);
  const mm = Math.round(m % 60);
  return h ? `${h}h ${mm}m` : `${mm}m`;
}
function fmtHour(h) {
  const ap = h < 12 ? "AM" : "PM";
  const x = h % 12 === 0 ? 12 : h % 12;
  return x + " " + ap;
}

async function loadStats() {
  try {
    const res = await fetch(BASE + "/stats");
    if (!res.ok) throw new Error("Server error " + res.status);
    const d = await res.json();
    if (!d.sessions) {
      statsBox.innerHTML = '<div class="muted">No listening history yet. Play a few songs (5+ seconds each) and press Refresh.</div>';
      return;
    }
    const maxM = Math.max(...d.moods.map(m => m.minutes), 0.01);
    const moodBars = d.moods.map(m => `
      <div class="row"><span style="text-transform:capitalize">${esc(m.mood)}</span><span>${fmtMin(m.minutes)}</span></div>
      <div class="bar"><div class="fill" style="width:${100 * m.minutes / maxM}%"></div></div>`).join("");
    const top = d.top_songs.map(s =>
      `<div class="song">${esc(s.song)}<br><small>${fmtMin(s.minutes)}</small></div>`).join("");
    const maxH = Math.max(...d.hours, 0.01);
    const peak = d.hours.indexOf(Math.max(...d.hours));
    const hbars = d.hours.map((m, h) =>
      `<div title="${fmtHour(h)}: ${m} min" style="flex:1;background:#7c5cff;height:${Math.max(2, 60 * m / maxH)}px;border-radius:2px"></div>`).join("");
    statsBox.innerHTML = `
      <div class="big">${fmtMin(d.total_minutes)}</div>
      <div class="muted">total listening · ${d.sessions} listening sessions</div>
      <div style="margin-top:16px"><b>Time by mood</b><div style="margin-top:8px">${moodBars}</div></div>
      <div style="margin-top:12px"><b>Top songs</b>${top}</div>
      <div style="margin-top:16px"><b>Active listening hours</b>
        <div class="muted">Most active around ${fmtHour(peak)}</div>
        <div style="display:flex;align-items:flex-end;gap:2px;height:60px;margin-top:8px">${hbars}</div>
        <div class="row muted"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>11 PM</span></div>
      </div>`;
  } catch (e) {
    statsBox.innerHTML = '<div class="muted">Start the server to see your listening stats.</div>';
  }
}
document.getElementById("refresh").onclick = loadStats;
loadStats();
</script>
</body>
</html>
